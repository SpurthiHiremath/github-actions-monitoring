name: GitHub Actions Monitoring

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Test S3 access
        run: aws s3 ls s3://${{ vars.S3_BUCKET }}

      - name: Run monitoring
        id: metrics
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          TARGET_REPOSITORY: ${{ vars.TARGET_REPOSITORY }}
        run: python monitor.py

      - name: Send email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: GitHub Actions Monitoring Report - ${{ steps.metrics.outputs.date }}
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions Monitoring
          body: |
            GitHub Actions Monitoring Report

            Repository: ${{ vars.TARGET_REPOSITORY }}
            Date: ${{ steps.metrics.outputs.date }}

            Total workflow runs: ${{ steps.metrics.outputs.total }}
            Successful runs: ${{ steps.metrics.outputs.successful }}
            Failed runs: ${{ steps.metrics.outputs.failed }}
            Success rate: ${{ steps.metrics.outputs.success_rate }}%

            Status: ${{ steps.metrics.outputs.failed != '0' && 'FAILURES DETECTED' || 'ALL WORKFLOWS SUCCESSFUL' }}
